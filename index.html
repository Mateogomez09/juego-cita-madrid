<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Conexión</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .card {
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
    }
    .fade-in {
      animation: fadeIn 0.5s ease-in-out forwards;
    }
    .fade-out {
      animation: fadeOut 0.4s ease-in-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeOut {
      from { opacity: 1; transform: translateY(0); }
      to { opacity: 0; transform: translateY(-10px); }
    }
  </style>
</head>
<body class="bg-gradient-to-br from-orange-50 via-red-50 to-rose-100 min-h-screen flex flex-col items-center justify-center p-6 text-gray-800 overflow-hidden">

  <!-- Contenedor Principal -->
  <div id="game-container" class="w-full max-w-sm flex flex-col items-center relative">
    
    <!-- Header -->
    <div class="text-center mb-8 w-full">
      <div class="flex justify-center items-center px-2">
        <span id="counter" class="text-sm font-medium text-gray-500 tracking-widest">1 / 16</span>
      </div>
      <!-- Barra de progreso -->
      <div class="w-full bg-gray-200 h-1.5 rounded-full mt-4 overflow-hidden relative">
        <div id="progress-bar" class="bg-gray-800 h-full rounded-full transition-all duration-500" style="width: 6.25%"></div>
      </div>
    </div>

    <!-- Carta -->
    <div id="card-area" class="w-full aspect-[4/5] bg-white rounded-3xl shadow-[0_20px_50px_-12px_rgba(0,0,0,0.1)] border border-white/50 p-8 flex flex-col items-center justify-center text-center relative card cursor-pointer overflow-hidden">
      <!-- Decoración fondo -->
      <div class="absolute top-0 right-0 -mr-8 -mt-8 w-32 h-32 bg-orange-100 rounded-full blur-2xl opacity-50"></div>
      <div class="absolute bottom-0 left-0 -ml-8 -mb-8 w-32 h-32 bg-rose-100 rounded-full blur-2xl opacity-50"></div>
      
      <div id="card-content" class="z-10 fade-in flex flex-col items-center justify-center h-full">
        <p id="question" class="text-xl md:text-2xl font-medium leading-relaxed text-gray-800">
          Si mañana hay un apocalipsis zombie, ¿quién sobreviviría más tiempo y por qué el otro moriría el primer día?
        </p>
      </div>
    </div>

    <!-- Controles -->
    <div class="mt-10 flex gap-3 w-full">
      <button id="prev-btn" class="flex-1 bg-white/80 text-gray-800 font-semibold py-4 rounded-2xl shadow-sm active:scale-95 transition-all text-base flex items-center justify-center opacity-50 cursor-not-allowed" disabled>
        ← Atrás
      </button>
      <button id="next-btn" class="flex-[2] bg-gray-900 text-white font-semibold py-4 rounded-2xl shadow-lg shadow-gray-900/20 active:scale-95 transition-all text-lg flex items-center justify-center gap-2">
        Siguiente →
      </button>
    </div>
  </div>

  <!-- Pantalla Final (Vacía) -->
  <div id="end-screen" class="hidden w-full h-screen">
  </div>

  <script>
    const questions = [
      "Si mañana hay un apocalipsis zombie, ¿quién sobreviviría más tiempo y por qué el otro moriría el primer día?",
      "¿En qué juego, deporte o tema estás 100% convencida de que me darías una paliza absoluta compitiendo?",
      "Si nos dieran 10 millones de euros pero tuviéramos que gastarlos por obligación en las próximas 24 horas, ¿qué haríamos exactamente?",
      "Si tuvieses que comprar un regalo para mí que me representase perfectamente, ¿qué sería?",
      "Si mañana salimos en las noticias porque nos han detenido a los dos, ¿por qué malentendido absurdo asumiría todo el mundo que ha sido?",
      "Si pudiéramos colarnos esta noche en cualquier sitio de Madrid sin que nadie nos viera ni hubiera consecuencias, ¿dónde nos meteríamos?",
      "¿Cuál fue exactamente tu primera impresión de mí la primera vez que hablamos?",
      "Desde que nos conocemos, ¿cuál es la manía o costumbre más rara que has notado que tengo?",
      "¿Qué es algo que pensabas de mí antes de conocerme bien y que luego ha resultado ser completamente distinto?",
      "Dime un recuerdo, una frase o un detalle de nosotros que, cuando te acuerdas de repente, siempre te saca una sonrisa.",
      "Si pudieras conectarme a un detector de mentiras ahora mismo y hacerme una sola pregunta, ¿cuál sería?",
      "Si mañana me despertara habiendo perdido la memoria, ¿cómo me explicarías exactamente qué somos ahora mismo y por qué nos hemos vuelto tan importantes el uno para el otro?",
      "¿Qué parte de ti sientes que solo puedes mostrar al 100% cuando estás a solas conmigo, y por qué crees que me la reservas a mí?",
      "Si pudieras guardar intacto para siempre un solo recuerdo de los que tenemos juntos hasta hoy, ¿cuál elegirías?",
      "¿Qué es algo bueno que hayas pensado sobre mí alguna vez pero que nunca me has llegado a decir en voz alta?",
      "¿Qué es lo que más tranquilidad o comodidad te transmite cuando pasamos tiempo juntos?"
    ];

    let currentIndex = 0;
    
    const questionEl = document.getElementById('question');
    const counterEl = document.getElementById('counter');
    const progressBarEl = document.getElementById('progress-bar');
    const cardContentEl = document.getElementById('card-content');
    const nextBtn = document.getElementById('next-btn');
    const prevBtn = document.getElementById('prev-btn');
    const gameContainer = document.getElementById('game-container');
    const endScreen = document.getElementById('end-screen');

    function updateUI() {
      if (currentIndex >= questions.length) {
        gameContainer.style.display = 'none';
        endScreen.style.display = 'block';
        return;
      }

      // Lógica botón Atrás
      if (currentIndex === 0) {
        prevBtn.disabled = true;
        prevBtn.classList.add('opacity-50', 'cursor-not-allowed');
      } else {
        prevBtn.disabled = false;
        prevBtn.classList.remove('opacity-50', 'cursor-not-allowed');
      }

      const q = questions[currentIndex];
      
      cardContentEl.classList.remove('fade-in');
      cardContentEl.classList.add('fade-out');
      
      setTimeout(() => {
        questionEl.textContent = q;
        counterEl.textContent = `${currentIndex + 1} / ${questions.length}`;
        
        const progress = ((currentIndex + 1) / questions.length) * 100;
        progressBarEl.style.width = `${progress}%`;
        
        cardContentEl.classList.remove('fade-out');
        cardContentEl.classList.add('fade-in');
      }, 400); 
    }

    nextBtn.addEventListener('click', () => {
      currentIndex++;
      updateUI();
    });

    prevBtn.addEventListener('click', () => {
      if (currentIndex > 0) {
        currentIndex--;
        updateUI();
      }
    });
  </script>
</body>
</html>
